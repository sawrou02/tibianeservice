# Configuration de déploiement pour Render (https://render.com)
# Ce fichier permet de mettre le site en ligne en quelques clics :
# Render lit ce fichier, crée le serveur web ET un disque de stockage
# persistant pour la base de données (aucune donnée n'est perdue lors
# des redémarrages ou des mises à jour).
services:
  - type: web
    name: tibiane-preinscription
    runtime: node
    plan: starter            # un disque persistant nécessite un plan payant (Starter)
    region: frankfurt        # région proche (Europe/Afrique) — modifiable
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: donnees          # disque persistant pour la base de données SQLite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data     # la base de données est écrite sur le disque persistant
      - key: ADMIN_USER
        value: admin         # identifiant de la page d'administration (modifiable)
      - key: ADMIN_PASSWORD
        sync: false          # mot de passe admin : à saisir lors de la mise en ligne
