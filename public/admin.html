<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — Préinscriptions</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: #eef1f0; }
    .admin-main { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      justify-content: space-between; margin-bottom: 16px;
    }
    .toolbar h2 { margin: 0; color: var(--primary-dark); }
    .toolbar-actions { display: flex; gap: 10px; align-items: center; }
    .count-badge {
      background: var(--primary); color: #fff; border-radius: 20px;
      padding: 4px 14px; font-weight: 700; font-size: 0.9rem;
    }
    .search-input {
      padding: 9px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 0.95rem; min-width: 220px;
    }
    .table-wrap {
      background: #fff; border-radius: var(--radius);
      box-shadow: var(--shadow); overflow-x: auto;
    }
    table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: var(--primary); color: #fff; position: sticky; top: 0; }
    tbody tr:nth-child(even) { background: #f7faf9; }
    tbody tr:hover { background: #eef7f3; }
    td.wrap { white-space: normal; max-width: 240px; }
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    .link-btn {
      display: inline-block; background: var(--accent); color: #1f2933;
      padding: 9px 16px; border-radius: 8px; font-weight: 700;
      text-decoration: none; font-size: 0.9rem;
    }
    .link-btn:hover { background: #dd9100; }
    .badge-yes { color: var(--success); font-weight: 700; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>TIBIANE SERVICE</h1>
      <p class="tagline">Espace d'administration — Préinscriptions</p>
    </div>
  </header>

  <main class="admin-main">
    <div class="toolbar">
      <h2>Liste des préinscriptions <span id="count" class="count-badge">0</span></h2>
      <div class="toolbar-actions">
        <input type="search" id="search" class="search-input" placeholder="Rechercher (nom, formation…)">
        <a href="/api/preinscriptions/export" class="link-btn">⬇ Exporter en CSV</a>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Naissance</th>
            <th>Lieu</th>
            <th>Niveau</th>
            <th>Dernier diplôme</th>
            <th>Formation</th>
            <th>WhatsApp</th>
            <th>Email</th>
            <th>Adresse</th>
            <th>Message</th>
            <th>Soumis le</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" hidden>Aucune préinscription pour le moment.</div>
    </div>
  </main>

  <script src="/js/admin.js"></script>
</body>
</html>
